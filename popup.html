<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px -apple-system, system-ui, sans-serif; width: 300px; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    #status { padding: 8px; background: #f4f4f4; border-radius: 4px; min-height: 32px; white-space: pre-wrap; word-break: break-word; }
    button { margin-top: 8px; padding: 6px; }
    .row { display: flex; gap: 6px; }
    .row button { flex: 1; }
    small { color: #666; }
    details { margin-top: 10px; border-top: 1px solid #eee; padding-top: 8px; }
    summary { cursor: pointer; font-size: 12px; color: #555; }
    label { display: block; font-size: 11px; color: #666; margin-top: 6px; }
    input { width: 100%; box-sizing: border-box; padding: 4px 6px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
    #saveMsg { font-size: 11px; color: #0a7d0a; margin-left: 6px; }
  </style>
</head>
<body>
  <h1>Coles Rapid Checker</h1>
  <div id="status">Loading…</div>
  <small id="ts"></small>
  <div id="params" style="margin-top:8px;font-size:11px;color:#666;"></div>
  <div class="row">
    <button id="check">Check now</button>
    <button id="open">Open checkout</button>
  </div>

  <details>
    <summary>Manual override</summary>
    <label>storeId
      <input id="storeIdInput" placeholder="e.g. 5683">
    </label>
    <label>addressId
      <input id="addressIdInput" placeholder="uuid">
    </label>
    <button id="save">Save</button>
    <span id="saveMsg"></span>
  </details>

  <script src="popup.js"></script>
</body>
</html>
